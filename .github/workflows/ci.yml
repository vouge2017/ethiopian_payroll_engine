name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Verify lock file install and import check
        run: |
          pip install -r requirements-lock.txt
          python -c "import flask_login; print('flask_login', flask_login.__version__)"
          python -c "from payroll_engine import create_app; app = create_app(); print('App created OK')"

      - name: Verify this is the Flask payroll app (not Django)
        run: |
          python -c "from payroll_engine import create_app; app = create_app(); print(app.name)"
          test ! -f manage.py
          test ! -f .github/workflows/django.yml

      - name: Lint with ruff
        run: |
          ruff check payroll_engine/ --select=E,F,W --ignore=E501,E402,W503 --exit-zero

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///:memory:
          CELERY_BROKER_URL: memory://
          SECRET_KEY: test-secret-key-for-ci-only
        run: |
          python -m pytest -v --tb=short --cov=payroll_engine --cov-report=term-missing
