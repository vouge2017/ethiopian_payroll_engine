name: CI

on:
  push:
    branches: [main, feature/elements-architecture, feature/approved-payroll-corrections, feature/monthly-payroll-journey]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check payroll_engine/ tests/
      - run: ruff format --check payroll_engine/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -r requirements-test.txt

      - name: Strict security & tenancy gate (fail-hard, no --continue)
        env:
          DATABASE_URL: "sqlite:///:memory:"
          CELERY_BROKER_URL: "memory://"
          SECRET_KEY: "test-secret-key-for-ci-only"
          FLASK_ENV: "testing"
          DB_ENCRYPTION_KEY: "test-encryption-key-for-ci-only-32b!"
        run: |
          python -m pytest \
            tests/test_lockout.py \
            tests/test_tenant_isolation.py \
            tests/test_tenant_bypass_guards.py \
            tests/test_billing.py             tests/test_period_and_lock.py             tests/test_usercompany_tenant.py             tests/test_migration_chain.py \
            tests/test_security_wave1.py \
            tests/test_security_regressions.py \
            -q

      - name: Run tests (subprocess isolation)
        env:
          DATABASE_URL: "sqlite:///:memory:"
          CELERY_BROKER_URL: "memory://"
          SECRET_KEY: "test-secret-key-for-ci-only"
          FLASK_ENV: "testing"
          DB_ENCRYPTION_KEY: "test-encryption-key-for-ci-only-32b!"
        run: |
          python run_tests.py --continue

      - name: Coverage report
        if: matrix.python-version == '3.12'
        env:
          DATABASE_URL: "sqlite:///:memory:"
          CELERY_BROKER_URL: "memory://"
          SECRET_KEY: "test-secret-key-for-ci-only"
          FLASK_ENV: "testing"
          DB_ENCRYPTION_KEY: "test-encryption-key-for-ci-only-32b!"
        run: |
          python -m pytest --cov=payroll_engine --cov-report=term-missing --cov-report=html -q --tb=no 2>&1 | tail -30

  test-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ethiopay
          POSTGRES_PASSWORD: test-password-ci-only
          POSTGRES_DB: ethiopayroll_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ethiopay"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Install PDF test dependencies
        run: pip install -r requirements-test.txt

      - name: Run migrations against PostgreSQL
        env:
          DATABASE_URL: "postgresql://ethiopay:test-password-ci-only@localhost:5432/ethiopayroll_test"
          SECRET_KEY: "test-secret-key-for-ci-only"
          FLASK_ENV: "testing"
          DB_ENCRYPTION_KEY: "test-encryption-key-for-ci-only-32b!"
        run: |
          python -c "
          from payroll_engine import create_app, db
          app = create_app()
          with app.app_context():
              from flask_migrate import upgrade
              upgrade()
              print('All migrations applied successfully')
          "

      - name: Run explicit PostgreSQL migration and money regressions
        env:
          DATABASE_URL: "sqlite:///:memory:"
          TEST_DATABASE_URL: "postgresql://ethiopay:test-password-ci-only@localhost:5432/ethiopayroll_test"
          SECRET_KEY: "test-secret-key-for-ci-only"
          FLASK_ENV: "testing"
          DB_ENCRYPTION_KEY: "test-encryption-key-for-ci-only-32b!"
        run: |
          python -m pytest tests/test_migration_chain.py tests/test_pg_corrections.py tests/test_pg_monthly_journey.py tests/test_pg_pr8_reconciliation.py tests/test_pg_catalog_types.py tests/test_pg_deduction_identity.py tests/test_pg_encrypted_employee.py tests/test_pg_report_queries.py tests/test_pg_spreadsheet_inputs.py tests/test_pg_period_absence.py tests/test_pg_worksheet_journey.py tests/test_pg_accounting_outputs.py tests/test_pg_published_register.py tests/test_pg_calculation_context.py tests/test_pg_legacy_delivery.py tests/test_pg_diff_access.py tests/test_pg_import_money.py -q

      - name: Verify migration rollback
        if: always()
        env:
          DATABASE_URL: "postgresql://ethiopay:test-password-ci-only@localhost:5432/ethiopayroll_test"
          SECRET_KEY: "test-secret-key-for-ci-only"
          FLASK_ENV: "testing"
          DB_ENCRYPTION_KEY: "test-encryption-key-for-ci-only-32b!"
        run: |
          python -c "
          from payroll_engine import create_app, db
          app = create_app()
          with app.app_context():
              from flask_migrate import downgrade, upgrade
              downgrade(revision='-1')
              upgrade()
              print('Migration rollback/rollforward verified')
          "
