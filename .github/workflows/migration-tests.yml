name: Migration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  migration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ethiopay
          POSTGRES_PASSWORD: test-password-ci-only
          POSTGRES_DB: ethiopayroll_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ethiopay"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migration chain tests
        env:
          TEST_DATABASE_URL: "postgresql://ethiopay:test-password-ci-only@localhost:5432/ethiopayroll_test"
          DATABASE_URL: "postgresql://ethiopay:test-password-ci-only@localhost:5432/ethiopayroll_test"
          SECRET_KEY: "test-secret-key-for-ci-only"
          FLASK_ENV: "testing"
          DB_ENCRYPTION_KEY: "test-encryption-key-for-ci-only-32b!"
        run: |
          python -m pytest tests/test_migration_chain.py -v
