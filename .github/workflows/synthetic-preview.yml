name: Synthetic Preview

on:
  push:
    branches: [codex/synthetic-preview]
  pull_request:
    branches: [main]
    paths:
      - 'seed_staging.py'
      - 'render-staging.yaml'
      - 'Dockerfile*'
      - '.dockerignore'
      - 'payroll_engine/schema_health.py'
      - 'payroll_engine/__init__.py'
      - 'payroll_engine/auth.py'
      - 'payroll_engine/billing.py'
      - 'run.py'
      - 'scripts/container_healthcheck.py'
      - 'tests/test_pg_synthetic_preview.py'
      - 'tests/test_pg_readiness.py'
      - 'tests/test_container_healthcheck.py'
      - 'tests/test_auth_entry_recovery.py'
      - 'tests/test_progressive_profiling.py'
      - 'tests/test_phone_auth.py'
      - '.github/workflows/synthetic-preview.yml'
  workflow_dispatch:

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ethiopay
          POSTGRES_PASSWORD: test-password-ci-only
          POSTGRES_DB: ethiopayroll_staging
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U ethiopay -d ethiopayroll_staging"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-test.txt
      - name: Install test dependencies
        run: pip install -r requirements-lock.txt -r requirements-test.txt
      - name: Check auth recovery, profile names and preview readiness
        env:
          FLASK_ENV: testing
          DATABASE_URL: 'sqlite:///:memory:'
          TEST_DATABASE_URL: 'postgresql://ethiopay:test-password-ci-only@localhost:5432/ethiopayroll_staging'
          SECRET_KEY: test-secret-key-for-ci-only
          DB_ENCRYPTION_KEY: test-encryption-key-for-ci-only-32b!
          CELERY_BROKER_URL: 'memory://'
        run: python -m pytest tests/test_auth_entry_recovery.py tests/test_progressive_profiling.py tests/test_phone_auth.py tests/test_pg_synthetic_preview.py tests/test_pg_readiness.py tests/test_container_healthcheck.py -q
      - name: Build web and worker images
        run: |
          docker build -t payroll-preview-web .
          docker build -f Dockerfile.worker -t payroll-preview-worker .
      - name: Boot and provision the real staging container
        shell: bash
        run: |
          preview_secret=$(openssl rand -hex 32)
          preview_key=$(openssl rand -hex 32)
          preview_owner=$(openssl rand -hex 24)
          preview_accountant=$(openssl rand -hex 24)
          preview_args=(
            --name payroll-preview-ci --network host -d
            -e FLASK_ENV=staging -e ENABLE_DEMO_MODE=false
            -e ENABLE_SYNTHETIC_PREVIEW=true -e PORT=8000
            -e "SECRET_KEY=$preview_secret" -e "DB_ENCRYPTION_KEY=$preview_key"
            -e "PREVIEW_OWNER_PASSWORD=$preview_owner"
            -e "PREVIEW_ACCOUNTANT_PASSWORD=$preview_accountant"
            -e 'DATABASE_URL=postgresql://ethiopay:test-password-ci-only@127.0.0.1:5432/ethiopayroll_staging'
            payroll-preview-web
          )
          docker run "${preview_args[@]}"
          for attempt in $(seq 1 60); do
            if curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/readyz > /tmp/preview-ready.json; then
              break
            fi
            sleep 2
          done
          python -c "import json; p=json.load(open('/tmp/preview-ready.json')); assert p['status']=='ready'; assert p['checks']['schema']=='current'; assert p['checks']['migrations']=='current'"
          docker exec payroll-preview-ci python scripts/container_healthcheck.py
          docker exec payroll-preview-ci python seed_staging.py --database-name ethiopayroll_staging --database-host 127.0.0.1
          docker exec -e FLASK_APP=run:app payroll-preview-ci flask seed-staging --database-name ethiopayroll_staging --database-host 127.0.0.1
          curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/auth/login > /tmp/preview-login.html
          python -c "from pathlib import Path; p=Path('/tmp/preview-login.html').read_text(); assert 'id=\"loginForm\"' in p; assert 'csrf_token' in p"
      - name: Container diagnostics
        if: failure()
        run: docker logs payroll-preview-ci
      - name: Remove only the CI container
        if: always()
        run: docker rm -f payroll-preview-ci || true
