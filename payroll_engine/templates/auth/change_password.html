{% extends "base.html" %}
{% block title %}Change Password - Ethiopian Payroll Engine{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header bg-transparent">
                    <h5 class="mb-0"><i class="bi bi-key me-2"></i>Change password</h5>
                </div>
                <div class="card-body p-4">
                    {% if forced %}
                    <div class="alert alert-warning">
                        You signed in with a temporary password. Choose a new password to continue.
                    </div>
                    {% endif %}
                    <form method="POST" action="{{ url_for('auth.change_password') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="current_password" class="form-label">Current password</label>
                            <input type="password" class="form-control" id="current_password"
                                   name="current_password" required autofocus autocomplete="current-password">
                        </div>
                        <div class="mb-3">
                            <label for="new_password" class="form-label">New password</label>
                            <input type="password" class="form-control" id="new_password"
                                   name="new_password" required minlength="8" autocomplete="new-password">
                            <div class="form-text">At least 8 characters.</div>
                        </div>
                        <div class="mb-3">
                            <label for="new_password2" class="form-label">Confirm new password</label>
                            <input type="password" class="form-control" id="new_password2"
                                   name="new_password2" required minlength="8" autocomplete="new-password">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Update password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
