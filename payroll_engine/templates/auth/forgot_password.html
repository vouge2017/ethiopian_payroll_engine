{% extends "base.html" %}
{% block title %}Forgot Password — EthioPayroll{% endblock %}
{% block content %}
<div class="container" style="max-width: 480px; margin-top: 2rem;">
  <div class="card">
    <h2>🔑 Forgot Password</h2>
    <p>Enter your phone number or email address. If an account exists, we'll generate a reset token.</p>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="login_id">Phone or Email</label>
        <input type="text" id="login_id" name="login_id" class="form-control"
               placeholder="0911234567 or you@example.com" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Send Reset Link</button>
    </form>
    <p style="margin-top: 1rem; text-align: center;">
      <a href="{{ url_for('auth.login') }}">← Back to login</a>
    </p>
  </div>
</div>
{% endblock %}
