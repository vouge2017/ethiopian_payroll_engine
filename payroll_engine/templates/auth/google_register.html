{% extends "base.html" %}
{% block title %}Complete Registration - Ethiopian Payroll Engine{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-google text-primary" style="font-size: 3rem;"></i>
                <h2 class="mt-2">Complete Your Registration</h2>
                <p class="text-muted">Signed in as <strong>{{ email }}</strong></p>
            </div>
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.google_register') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number *</label>
                            <div class="input-group">
                                <span class="input-group-text">+251</span>
                                <input type="tel" class="form-control" id="phone" name="phone"
                                       required placeholder="9XXXXXXXX">
                            </div>
                            <div class="form-text">Enter 9 digits starting with 9 or 7</div>
                        </div>
                        <div class="mb-3">
                            <label for="company_name" class="form-label">Company Name *</label>
                            <input type="text" class="form-control" id="company_name" name="company_name"
                                   required placeholder="Your company name">
                            <div class="form-text">This will be used for your payroll workspace</div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-check-circle me-2"></i>Complete Registration
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
