{% extends "base.html" %}
{% block title %}Login - Ethiopian Payroll Engine{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-4">
            <div class="text-center mb-4">
                <i class="bi bi-bank text-primary" style="font-size: 3rem;"></i>
                <h2 class="mt-2">Ethiopian Payroll Engine</h2>
                <p class="text-muted">Sign in to manage your payroll</p>
            </div>
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember">
                            <label class="form-check-label" for="remember">Remember me</label>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Log In</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center bg-light">
                    <small>Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
