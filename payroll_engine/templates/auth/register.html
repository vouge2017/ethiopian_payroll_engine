{% extends "base.html" %}
{% block title %}Register - Ethiopian Payroll Engine{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-bank text-primary" style="font-size: 3rem;"></i>
                <h2 class="mt-2">{{ create_account }}</h2>
                <p class="text-muted">{{ start_payroll_message }}</p>
            </div>
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number *</label>
                            <div class="input-group">
                                <span class="input-group-text">+251</span>
                                <input type="tel" class="form-control" id="phone" name="phone"
                                       required placeholder="9XXXXXXXX">
                            </div>
                            <div class="form-text">Enter 9 digits starting with 9 or 7</div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">{{ _('email') }} <span class="text-muted">(optional)</span></label>
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="you@email.com">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">{{ _('password') }} *</label>
                            <input type="password" class="form-control" id="password" name="password" required minlength="8">
                            <div class="form-text">At least 8 characters.</div>
                        </div>
                        <div class="mb-3">
                            <label for="password2" class="form-label">Confirm Password *</label>
                            <input type="password" class="form-control" id="password2" name="password2" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">{{ _('register') }}</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center bg-light">
                    <small>Already have an account? <a href="{{ url_for('auth.login') }}">{{ _('log_in') }}</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
