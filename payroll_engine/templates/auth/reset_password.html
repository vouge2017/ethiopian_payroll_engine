{% extends "base.html" %}
{% block title %}Reset Password — EthioPayroll{% endblock %}
{% block content %}
<div class="container" style="max-width: 480px; margin-top: 2rem;">
  <div class="card">
    <h2>🔒 Set New Password</h2>
    <p>Enter your new password below.</p>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="At least 8 characters" required autofocus>
      </div>
      <div class="form-group">
        <label for="password2">Confirm Password</label>
        <input type="password" id="password2" name="password2" class="form-control"
               placeholder="Type it again" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
