{% extends "base.html" %}
{% block title %}Company Profile - Ethiopian Payroll Engine{% endblock %}
{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-building me-2"></i>Company Profile</h5>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('settings.company_profile') }}" enctype="multipart/form-data">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Company Name *</label>
                                <input type="text" class="form-control" name="name" value="{{ company.name }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">TIN (Tax Identification Number)</label>
                                <input type="text" class="form-control" name="tin" value="{{ company.tin or '' }}">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Address</label>
                                <input type="text" class="form-control" name="address" value="{{ company.address or '' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone</label>
                                <input type="text" class="form-control" name="phone" value="{{ company.phone or '' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Logo (PNG or JPG)</label>
                                <input type="file" class="form-control" name="logo" accept=".png,.jpg,.jpeg">
                                {% if company.logo_path %}
                                <div class="mt-2">
                                    <img src="{{ url_for('static', filename=company.logo_path) }}" alt="Company Logo" style="max-height: 60px;">
                                    <small class="text-muted d-block">Current logo</small>
                                </div>
                                {% endif %}
                            </div>
                        </div>
                        <hr>
                        <p class="text-muted small">
                            <i class="bi bi-info-circle me-1"></i>
                            Company name, TIN, and logo appear on PDF payslips and reports.
                        </p>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>Save Changes
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
