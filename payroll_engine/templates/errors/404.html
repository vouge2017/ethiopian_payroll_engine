{% extends "base.html" %}
{% block title %}Page Not Found — EthioPayroll{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="text-center">
        <div style="font-size: 5rem; font-weight: 800; color: var(--brand-primary); opacity: 0.3; line-height: 1;">404</div>
        <h2 class="mt-3 mb-2">Page Not Found</h2>
        <p class="text-muted mb-4" style="max-width: 400px;">The page you're looking for doesn't exist or has been moved.</p>
        <div class="d-flex gap-2 justify-content-center">
            <a href="{{ url_for('main.companies_dashboard') }}" class="btn btn-primary">
                <i class="bi bi-house me-1"></i>Go to Dashboard
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
