{% extends "base.html" %}
{% block title %}Too many sign-in attempts — EthioPayroll{% endblock %}
{% block content %}
<div class="container py-5">
    <h1>Too many sign-in attempts</h1>
    <p>Please wait at least {{ retry_seconds }} seconds before trying to sign in again.</p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Back to sign in</a>
</div>
{% endblock %}
