{% extends "base.html" %}
{% block title %}Something Went Wrong — EthioPayroll{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="text-center">
        <div style="font-size: 5rem; font-weight: 800; color: var(--color-danger); opacity: 0.3; line-height: 1;">500</div>
        <h2 class="mt-3 mb-2">Something Went Wrong</h2>
        <p class="text-muted mb-4" style="max-width: 400px;">An unexpected error occurred. Our team has been notified. Please try again in a moment.</p>
        <div class="d-flex gap-2 justify-content-center">
            <a href="{{ url_for('main.companies_dashboard') }}" class="btn btn-primary">
                <i class="bi bi-house me-1"></i>Go to Dashboard
            </a>
            <a href="javascript:location.reload()" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-clockwise me-1"></i>Try Again
            </a>
        </div>
    </div>
</div>
{% endblock %}
