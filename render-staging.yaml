# Render Blueprint — STAGING environment
# Deploy with: render blueprint launch --blueprint render-staging.yaml
#
# This creates a separate staging deployment with its own database.
# It does NOT share any data with production.
#
# After deploying:
#   1. Set DB_ENCRYPTION_KEY in Render dashboard (generate: python3 -c "import secrets; print(secrets.token_hex(32))")
#   2. Run seed script: flask seed-staging
#   3. Test at the staging URL before promoting to production

services:
  - type: web
    name: ethiopayroll-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ethiopayroll-staging-db
          property: connectionString
      - key: FLASK_ENV
        value: staging
      - key: FLASK_APP
        value: wsgi:app
      - key: DB_ENCRYPTION_KEY
        generateValue: true
      - key: ENABLE_DEMO_MODE
        value: "true"
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
    autoDeploy: true

databases:
  - name: ethiopayroll-staging-db
    plan: starter
    databaseName: ethiopayroll_staging
    ipAllowList: []
