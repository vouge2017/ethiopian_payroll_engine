# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys web service + worker + managed Postgres + Redis.
#
# After deploying, set these in the Render dashboard → Environment:
#   SECRET_KEY  — generate with: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
#
# Managed Postgres provides:
#   DATABASE_URL — auto-set by Render (internal connection string)
#   Automated daily backups with point-in-time recovery
#   Verify at: Render Dashboard → your Postgres instance → Backups tab

services:
  - type: web
    name: ethiopian-payroll-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ethiopian-payroll-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: ethiopian-payroll-redis
          property: connectionString
      - key: FLASK_ENV
        value: production
    autoDeploy: true

  - type: worker
    name: ethiopian-payroll-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A celery_worker.celery worker --loglevel=info
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ethiopian-payroll-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: ethiopian-payroll-redis
          property: connectionString
      - key: FLASK_ENV
        value: production

  - type: redis
    name: ethiopian-payroll-redis
    plan: starter
    ipAllowList: []   # only internal services

databases:
  - name: ethiopian-payroll-db
    plan: starter       # free tier includes automated backups
    databaseName: ethiopayroll
    ipAllowList: []     # only internal services
