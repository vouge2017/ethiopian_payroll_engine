# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys web service + worker + managed Postgres + Redis.
#
# After deploying, set these in the Render dashboard → Environment:
#   SECRET_KEY  — generate with: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
#
# Managed Postgres provides:
#   DATABASE_URL — auto-set by Render (internal connection string)
#   Automated daily backups with point-in-time recovery
#   Verify at: Render Dashboard → your Postgres instance → Backups tab

services:
  - type: web
    name: ethiopian-payroll-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ethiopian-payroll-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: wsgi:app
      - key: DB_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
      - key: REDIS_URL
        fromService:
          name: ethiopian-payroll-redis
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          name: ethiopian-payroll-redis
          property: connectionString
    autoDeploy: true

  - type: worker
    name: ethiopian-payroll-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ethiopian-payroll-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ethiopian-payroll-redis
          property: connectionString
      - key: FLASK_APP
        value: wsgi:app
      - key: DB_ENCRYPTION_KEY
        generateValue: true
    autoDeploy: true

databases:
  - name: ethiopian-payroll-db
    plan: standard      # managed PG w/ PITR backups (production requirement)
    databaseName: ethiopayroll
    ipAllowList: []     # only internal services

redis:
  - name: ethiopian-payroll-redis
    plan: starter       # free tier: 25MB, shared CPU
    ipAllowList: []     # only internal services
