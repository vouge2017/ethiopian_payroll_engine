# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys web service + managed Postgres.
#
# After deploying, set these in the Render dashboard → Environment:
#   SECRET_KEY  — generate with: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
#
# Managed Postgres provides:
#   DATABASE_URL — auto-set by Render (internal connection string)
#   Automated daily backups with point-in-time recovery
#   Verify at: Render Dashboard → your Postgres instance → Backups tab

services:
  - type: web
    name: ethiopian-payroll-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && gunicorn --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ethiopian-payroll-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: wsgi:app
      - key: DB_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
      # Uncomment when Redis is added to the deployment:
      # - key: RATELIMIT_STORAGE_URI
      #   value: "redis://red-xxxx:6379/1"
    autoDeploy: true

databases:
  - name: ethiopian-payroll-db
    plan: starter       # free tier includes automated backups
    databaseName: ethiopayroll
    ipAllowList: []     # only internal services
