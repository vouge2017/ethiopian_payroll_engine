{% extends "base.html" %}

{% block title %}Login - Ethiopian Payroll Engine{% endblock %}

{% block content %}
<main class="container" style="max-width: 460px; margin-top: 4rem;">
    <div class="text-center mb-4">
        <h2><i class="bi bi-calculator"></i> Ethiopian Payroll Engine</h2>
        <p class="text-muted">Sign in to manage your payroll</p>
    </div>

    <div class="card">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
                </div>
            </form>
        </div>
        <div class="card-footer text-center bg-white">
            <small>Don't have an account? <a href="{{ url_for('auth.register') }}">Register your company</a></small>
        </div>
    </div>
</main>
{% endblock %}
